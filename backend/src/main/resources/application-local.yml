# Local development profile. Activate with: SPRING_PROFILES_ACTIVE=local
# Values still resolve from environment variables (see root .env.example) so secrets stay out of git.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnkk}
    username: ${DB_USERNAME:learnkk}
    password: ${DB_PASSWORD:learnkk}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.learnkk: DEBUG
    org.hibernate.SQL: DEBUG
