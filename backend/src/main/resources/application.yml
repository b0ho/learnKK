spring:
  application:
    name: learnkk-backend
  # Secrets (DB credentials) are injected via environment / Spring profile — never committed.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnkk}
    username: ${DB_USERNAME:learnkk}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        # snake_case physical naming (project.md mandated).
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false
  # Attachment uploads (U6): the 20MB business cap (A1) is enforced in AttachmentService so it
  # returns a clean 400 ATTACHMENT_TOO_LARGE. The container limits sit slightly above as a hard
  # ceiling guarding against extreme uploads (mapped to 413 by GlobalExceptionHandler).
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: ${SERVER_PORT:8080}

# Application-specific secret placeholder (self-managed session token signing/seed).
learnkk:
  session:
    secret: ${SESSION_SECRET:change-me-in-local-env}
