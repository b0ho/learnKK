openapi: 3.0.3
info:
  title: learnKK (런크크) API
  version: 0.4.0-bolt7
  description: >
    Bolt 7 contract. Adds the pre-application survey answers and course feedback (U8) on top of
    Bolt 3: mentee submits pre-survey answers (gated to IN_PROGRESS meetings), the owning
    mentor/admin/self read answers, mentee submits course feedback, and the owning mentor/admin
    list feedback. SurveyQuestionDto now carries an id (populated on read). Errors use a uniform
    ErrorPayload body. Enum values are stored as varchar + CHECK in the DB (contract #3).
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: auth
  - name: users
  - name: meetings
  - name: enrollments
  - name: survey
  - name: feedback
  - name: admin

paths:
  /api/auth/signup:
    post:
      tags: [auth]
      summary: Register a new user (MENTOR or MENTEE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in and obtain a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/profile:
    get:
      tags: [users]
      summary: Get the current user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [users]
      summary: Update the current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/meetings:
    post:
      tags: [meetings]
      summary: Create a meeting (mentor only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [meetings]
      summary: List recruiting meetings
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: recruiting
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMeetingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/meetings/mine:
    get:
      tags: [meetings]
      summary: List the current mentor's own meetings (any status)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMeetingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/meetings/{id}:
    get:
      tags: [meetings]
      summary: Get a meeting by id
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/meetings/{id}/questions:
    get:
      tags: [meetings]
      summary: Get a meeting's survey questions
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyQuestionDto'
    put:
      tags: [meetings]
      summary: Replace a meeting's survey questions (owning mentor only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SurveyQuestionDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyQuestionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/meetings/{id}/enrollments:
    post:
      tags: [enrollments]
      summary: Apply to a meeting (mentee only, first-come-first-served)
      description: >
        MENTEE-only. The meeting must be RECRUITING (else 409 ENROLLMENT_NOT_OPEN). Capacity is
        enforced race-free (409 ENROLLMENT_FULL when full); a duplicate application yields 409
        ENROLLMENT_DUPLICATE.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/meetings/{id}/enrollments/mine:
    delete:
      tags: [enrollments]
      summary: Cancel the caller's own enrollment
      description: >
        Allowed only before start ② (meeting in RECRUITING or READY_TO_START); otherwise 409
        ENROLLMENT_CANCEL_FORBIDDEN. The freed seat returns to capacity.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/meetings/{id}/applicants:
    get:
      tags: [enrollments]
      summary: List a meeting's applicants (owning mentor or admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/enrollments/mine:
    get:
      tags: [enrollments]
      summary: List the caller's own enrollments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/meetings/{id}/survey-answers:
    post:
      tags: [survey]
      summary: Submit (or re-submit) pre-application survey answers (participating mentee)
      description: >
        Participating MENTEE only, and only while the meeting is IN_PROGRESS (else 409
        PRESURVEY_NOT_OPEN). Every required question must be answered (else 400
        PRESURVEY_REQUIRED_MISSING). Answers are upserted per (question, mentee).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyAnswerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/meetings/{id}/survey-answers/mine:
    get:
      tags: [survey]
      summary: Read the caller's own pre-application survey answers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyAnswerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/meetings/{id}/mentees/{menteeId}/survey-answers:
    get:
      tags: [survey]
      summary: Read a mentee's pre-application survey answers (owning mentor or admin)
      description: >
        Allowed for the owning mentor, an admin, or the mentee themselves. No status gate —
        mentor/admin can read after the meeting completes. Otherwise 403 PRESURVEY_FORBIDDEN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - name: menteeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyAnswerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/meetings/{id}/feedback:
    post:
      tags: [feedback]
      summary: Submit (or re-submit) course feedback (participating mentee)
      description: >
        Participating MENTEE only, and only while the meeting is IN_PROGRESS or COMPLETED (else 409
        FEEDBACK_NOT_OPEN / 403 FEEDBACK_FORBIDDEN for non-participants). Feedback is upserted per
        (meeting, mentee).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [feedback]
      summary: List a meeting's course feedback (owning mentor or admin)
      description: >
        Restricted to the owning mentor or an admin; any other caller (including other mentors and
        mentees) gets 403 FEEDBACK_FORBIDDEN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/meetings/{id}/approve:
    post:
      tags: [admin]
      summary: Approve meeting creation (T1, admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/meetings/{id}/reject:
    post:
      tags: [admin]
      summary: Reject meeting creation (T2, admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/meetings/{id}/confirm-recruitment:
    post:
      tags: [admin]
      summary: Confirm recruitment (T3) or cancel it (T4) — admin only
      description: >
        RECRUITING -> READY_TO_START when proceed is true, or RECRUITING -> CANCELLED when proceed
        is false (reason required). An illegal source state yields 409 MEETING_INVALID_TRANSITION.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRecruitmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/meetings/{id}/approve-start:
    post:
      tags: [admin]
      summary: Start the meeting (T5, admin only)
      description: READY_TO_START -> IN_PROGRESS. Illegal source state yields 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/meetings/{id}/complete:
    post:
      tags: [admin]
      summary: Complete the meeting (T6, admin only)
      description: >
        IN_PROGRESS -> COMPLETED. Gated on session completion; if any scheduled session has not
        ended the transition yields 409 MEETING_SESSIONS_NOT_ENDED. An illegal source state yields
        409 MEETING_INVALID_TRANSITION.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Opaque server-side session token (Authorization: Bearer <token>)"

  parameters:
    MeetingId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Validation or business-rule failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    Unauthorized:
      description: Missing / invalid / expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    Conflict:
      description: State conflict or uniqueness violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'

  schemas:
    Role:
      type: string
      enum: [MENTOR, MENTEE, ADMIN]

    MeetingStatus:
      type: string
      enum:
        - PENDING_APPROVAL
        - RECRUITING
        - READY_TO_START
        - IN_PROGRESS
        - COMPLETED
        - REJECTED
        - CANCELLED

    EnrollmentStatus:
      type: string
      enum: [APPLIED, CANCELLED]

    EnrollmentResponse:
      type: object
      required: [id, meetingId, menteeId, status, appliedAt]
      properties:
        id:
          type: integer
          format: int64
        meetingId:
          type: integer
          format: int64
        menteeId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
        appliedAt:
          type: string
          format: date-time

    ApplicantResponse:
      type: object
      required: [menteeId, appliedAt]
      properties:
        menteeId:
          type: integer
          format: int64
        nickname:
          type: string
          nullable: true
        appliedAt:
          type: string
          format: date-time

    ErrorPayload:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: UPPER_SNAKE domain code (<DOMAIN>_<REASON>)
        message:
          type: string
          description: Human-readable Korean message
        details:
          type: object
          nullable: true
          additionalProperties: true

    SignupRequest:
      type: object
      required: [nickname, password, employeeNo, role]
      properties:
        nickname:
          type: string
        password:
          type: string
          format: password
        employeeNo:
          type: string
        role:
          type: string
          description: MENTOR or MENTEE (ADMIN is rejected)
          enum: [MENTOR, MENTEE]

    LoginRequest:
      type: object
      required: [nickname, password]
      properties:
        nickname:
          type: string
        password:
          type: string
          format: password

    SessionResponse:
      type: object
      required: [token, role]
      properties:
        token:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    UserResponse:
      type: object
      required: [id, nickname, employeeNo, role]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        employeeNo:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    ProfileResponse:
      type: object
      required: [nickname, employeeNo, tags]
      properties:
        nickname:
          type: string
        employeeNo:
          type: string
        tags:
          type: array
          items:
            type: string
        intro:
          type: string
          nullable: true

    ProfileUpdateRequest:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        intro:
          type: string
          nullable: true

    MeetingCreateRequest:
      type: object
      required: [title, weeks, capacity]
      properties:
        title:
          type: string
        topic:
          type: string
          nullable: true
        weeks:
          type: integer
        recruitStart:
          type: string
          format: date-time
          nullable: true
        recruitEnd:
          type: string
          format: date-time
          nullable: true
        capacity:
          type: integer
        format:
          type: string
          nullable: true
        initialContent:
          type: string
          nullable: true

    MeetingResponse:
      type: object
      required: [id, mentorId, title, weeks, capacity, status]
      properties:
        id:
          type: integer
          format: int64
        mentorId:
          type: integer
          format: int64
        title:
          type: string
        topic:
          type: string
          nullable: true
        weeks:
          type: integer
        recruitStart:
          type: string
          format: date-time
          nullable: true
        recruitEnd:
          type: string
          format: date-time
          nullable: true
        capacity:
          type: integer
        format:
          type: string
          nullable: true
        initialContent:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/MeetingStatus'
        rejectReason:
          type: string
          nullable: true

    MeetingSummary:
      type: object
      required: [id, title, weeks, capacity, status]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        topic:
          type: string
          nullable: true
        weeks:
          type: integer
        capacity:
          type: integer
        status:
          $ref: '#/components/schemas/MeetingStatus'

    SurveyQuestionDto:
      type: object
      required: [orderNo, text, type]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Populated on read; ignored on the upsert/write path
        orderNo:
          type: integer
        text:
          type: string
        type:
          type: string
        options:
          type: array
          items:
            type: string
        required:
          type: boolean

    SurveyAnswerRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/SurveyAnswerItem'

    SurveyAnswerItem:
      type: object
      required: [questionId]
      properties:
        questionId:
          type: integer
