openapi: 3.0.3
info:
  title: learnKK (런크크) API
  version: 0.7.0-bolt7
  description: >
    Integrated contract (Bolt 3 + Bolt 4 + Bolt 5 + Bolt 6 + Bolt 7). Content (U6): week posts (body
    required, attachments 0..n), attachment upload/download as PostgreSQL bytea BLOBs (format
    whitelist + 20MB cap), and notices — reading restricted to participants (owning mentor, APPLIED
    mentee, admin — else 403 CONTENT_FORBIDDEN), writing restricted to the owning mentor. Direct
    messaging (U7): 1:1 threads, send, thread transcript (with idempotent read-receipt), polling
    unread count and the permitted-recipient picker; the messaging boundary (ADMIN↔everyone,
    MENTOR↔own active mentees, MENTEE↔applied mentors) is enforced server-side as 403
    MESSAGING_FORBIDDEN. Session/attendance (U5): session scheduling, scheduler-less pop-up
    attendance (time window), attendance rate, 80% completion auto-judgement and admin ④ approval;
    sessions live in the meeting_session table (isolated from the auth sessions table). Survey/
    feedback (U8): pre-survey answer submission (gated to IN_PROGRESS, per-question upsert), answer
    read, per-meeting feedback submission and read. Errors use a uniform ErrorPayload body. Enum
    values are stored as varchar + CHECK in the DB (contract #3).
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: auth
  - name: users
  - name: meetings
  - name: enrollments
  - name: content
  - name: messaging
  - name: sessions
  - name: attendance
  - name: completions
  - name: survey
  - name: feedback
  - name: admin

paths:
  /api/auth/signup:
    post:
      tags: [auth]
      summary: Register a new user (MENTOR or MENTEE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in and obtain a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me/profile:
    get:
      tags: [users]
      summary: Get the current user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [users]
      summary: Update the current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/meetings:
    post:
      tags: [meetings]
      summary: Create a meeting (mentor only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [meetings]
      summary: List recruiting meetings
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: recruiting
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMeetingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/meetings/mine:
    get:
      tags: [meetings]
      summary: List the current mentor's own meetings (any status)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMeetingSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/meetings/{id}:
    get:
      tags: [meetings]
      summary: Get a meeting by id
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/meetings/{id}/questions:
    get:
      tags: [meetings]
      summary: Get a meeting's survey questions
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyQuestionDto'
    put:
      tags: [meetings]
      summary: Replace a meeting's survey questions (owning mentor only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SurveyQuestionDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyQuestionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/meetings/{id}/enrollments:
    post:
      tags: [enrollments]
      summary: Apply to a meeting (mentee only, first-come-first-served)
      description: >
        MENTEE-only. The meeting must be RECRUITING (else 409 ENROLLMENT_NOT_OPEN). Capacity is
        enforced race-free (409 ENROLLMENT_FULL when full); a duplicate application yields 409
        ENROLLMENT_DUPLICATE.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/meetings/{id}/enrollments/mine:
    delete:
      tags: [enrollments]
      summary: Cancel the caller's own enrollment
      description: >
        Allowed only before start ② (meeting in RECRUITING or READY_TO_START); otherwise 409
        ENROLLMENT_CANCEL_FORBIDDEN. The freed seat returns to capacity.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/meetings/{id}/applicants:
    get:
      tags: [enrollments]
      summary: List a meeting's applicants (owning mentor or admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/enrollments/mine:
    get:
      tags: [enrollments]
      summary: List the caller's own enrollments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/meetings/{id}/posts:
    post:
      tags: [content]
      summary: Create a week post (owning mentor only)
      description: >
        Owning mentor only (else 403 CONTENT_FORBIDDEN). Body is required; week must fall within the
        meeting's [1, weeks] range (else 400 CONTENT_VALIDATION). Attachments are uploaded
        separately — a post with no attachments is valid.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [content]
      summary: List a meeting's week posts with attachment metadata (participants only)
      description: >
        Participants only — owning mentor, APPLIED mentee or admin (else 403 CONTENT_FORBIDDEN).
        Attachment payloads are not included; use the download endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/posts/{postId}/attachments:
    post:
      tags: [content]
      summary: Upload an attachment to a post (owning mentor only)
      description: >
        Owning mentor of the post's meeting only (else 403 CONTENT_FORBIDDEN). The content type must
        be on the whitelist (PDF / png·jpg·jpeg·gif·webp / docx·xlsx·pptx / txt — else 400
        ATTACHMENT_TYPE_NOT_ALLOWED) and the file must be ≤ 20MB (else 400 ATTACHMENT_TOO_LARGE, or
        413 if it exceeds the multipart container ceiling). A post may hold at most 10 attachments
        (else 409 ATTACHMENT_LIMIT). Payloads are stored as PostgreSQL bytea.
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/attachments/{attachmentId}:
    get:
      tags: [content]
      summary: Download an attachment (participants only)
      description: >
        Participants only — access is re-checked on every request (direct-URL defence). Served with
        Content-Disposition: attachment so browsers never render the payload inline (XSS defence).
      security:
        - bearerAuth: []
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK — the binary payload
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="<original>"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/meetings/{id}/notices:
    post:
      tags: [content]
      summary: Post a notice (owning mentor only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [content]
      summary: List a meeting's notices, newest first (participants only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoticeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/meetings/{id}/approve:
    post:
      tags: [admin]
      summary: Approve meeting creation (T1, admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/meetings/{id}/reject:
    post:
      tags: [admin]
      summary: Reject meeting creation (T2, admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/meetings/{id}/confirm-recruitment:
    post:
      tags: [admin]
      summary: Confirm recruitment (T3) or cancel it (T4) — admin only
      description: >
        RECRUITING -> READY_TO_START when proceed is true, or RECRUITING -> CANCELLED when proceed
        is false (reason required). An illegal source state yields 409 MEETING_INVALID_TRANSITION.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRecruitmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/meetings/{id}/approve-start:
    post:
      tags: [admin]
      summary: Start the meeting (T5, admin only)
      description: READY_TO_START -> IN_PROGRESS. Illegal source state yields 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/meetings/{id}/complete:
    post:
      tags: [admin]
      summary: Complete the meeting (T6, admin only)
      description: >
        IN_PROGRESS -> COMPLETED. Gated on session completion; if any scheduled session has not
        ended the transition yields 409 MEETING_SESSIONS_NOT_ENDED. An illegal source state yields
        409 MEETING_INVALID_TRANSITION.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/messages:
    post:
      tags: [messaging]
      summary: Send a direct message
      description: >
        Sends a message to another user. Empty body or self-send → 400; unknown recipient → 404; a
        recipient outside the caller's messaging boundary → 403 MESSAGING_FORBIDDEN. The
        (sender, recipient) thread is found or created (normalized pair).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/messages/threads:
    get:
      tags: [messaging]
      summary: List the caller's threads (most-recently-active first)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThreadSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/messages/threads/{id}:
    get:
      tags: [messaging]
      summary: Read a thread transcript (marks received messages read)
      description: >
        Returns the thread's messages oldest-first and idempotently marks every message the caller
        received as read. A non-participant gets 403; an unknown thread 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: size
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          description: "Sort expression; only 'createdAt' is allowed."
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/messages/unread-count:
    get:
      tags: [messaging]
      summary: Total unread messages for the caller (polling badge)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/messages/recipients:
    get:
      tags: [messaging]
      summary: Users the caller is permitted to message (FE picker)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipientResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/meetings/{id}/sessions:
    post:
      tags: [sessions]
      summary: Add a session to a meeting (owning mentor only)
      description: >
        The caller must be the owning mentor (else 403 SESSION_FORBIDDEN) and the meeting must be
        IN_PROGRESS (else 409 SESSION_MEETING_NOT_ACTIVE).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [sessions]
      summary: List a meeting's sessions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/sessions/{id}:
    put:
      tags: [sessions]
      summary: Reschedule a session (owning mentor only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{id}/attendance:
    post:
      tags: [attendance]
      summary: Pop-up self check-in for a session (participant mentee only)
      description: >
        Valid only within the check-in window [scheduledAt, scheduledAt + checkInWindowMinutes]
        (else 409 ATTENDANCE_WINDOW_CLOSED). Non-participants get 403 ATTENDANCE_NOT_PARTICIPANT;
        a non-IN_PROGRESS meeting gets 409 SESSION_MEETING_NOT_ACTIVE. Idempotent per
        (session, mentee).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '201':
          description: Created (or existing attendance returned idempotently)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/meetings/{id}/my-attendance:
    get:
      tags: [attendance]
      summary: The caller's attendance summary for a meeting
      description: "rate = attended / totalScheduled when totalScheduled > 0, else 0 (S=0 guard)."
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/meetings/{id}/completions/compute:
    post:
      tags: [completions]
      summary: Run the 80% completion auto-judgement (owning mentor or admin)
      description: >
        For each participant a*100 >= 80*S marks COMPLETION_CANDIDATE (integer test); S=0 withholds
        candidacy (NOT_COMPLETED). Already COMPLETED rows are not re-judged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenteeCompletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/meetings/{id}/completions:
    get:
      tags: [completions]
      summary: List a meeting's completion judgements (owning mentor or admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenteeCompletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/meetings/{id}/completions/{menteeId}/approve:
    post:
      tags: [completions]
      summary: Approve a mentee's completion (④, admin only)
      description: >
        Already COMPLETED yields 409 COMPLETION_ALREADY_APPROVED (checked first); a
        non-COMPLETION_CANDIDATE yields 409 COMPLETION_NOT_ELIGIBLE.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - name: menteeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenteeCompletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'


  /api/meetings/{id}/survey-answers:
    post:
      tags: [survey]
      summary: Submit (or re-submit) pre-application survey answers (participating mentee)
      description: >
        Participating MENTEE only, and only while the meeting is IN_PROGRESS (else 409
        PRESURVEY_NOT_OPEN). Every required question must be answered (else 400
        PRESURVEY_REQUIRED_MISSING). Answers are upserted per (question, mentee).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyAnswerRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/meetings/{id}/survey-answers/mine:
    get:
      tags: [survey]
      summary: Read the caller's own pre-application survey answers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyAnswerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/meetings/{id}/mentees/{menteeId}/survey-answers:
    get:
      tags: [survey]
      summary: Read a mentee's pre-application survey answers (owning mentor or admin)
      description: >
        Allowed for the owning mentor, an admin, or the mentee themselves. No status gate —
        mentor/admin can read after the meeting completes. Otherwise 403 PRESURVEY_FORBIDDEN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
        - name: menteeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyAnswerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/meetings/{id}/feedback:
    post:
      tags: [feedback]
      summary: Submit (or re-submit) course feedback (participating mentee)
      description: >
        Participating MENTEE only, and only while the meeting is IN_PROGRESS or COMPLETED (else 409
        FEEDBACK_NOT_OPEN / 403 FEEDBACK_FORBIDDEN for non-participants). Feedback is upserted per
        (meeting, mentee).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [feedback]
      summary: List a meeting's course feedback (owning mentor or admin)
      description: >
        Restricted to the owning mentor or an admin; any other caller (including other mentors and
        mentees) gets 403 FEEDBACK_FORBIDDEN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MeetingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Opaque server-side session token (Authorization: Bearer <token>)"

  parameters:
    MeetingId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Validation or business-rule failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    Unauthorized:
      description: Missing / invalid / expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    Conflict:
      description: State conflict or uniqueness violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'
    PayloadTooLarge:
      description: Upload exceeds the multipart container ceiling
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorPayload'

  schemas:
    Role:
      type: string
      enum: [MENTOR, MENTEE, ADMIN]

    MeetingStatus:
      type: string
      enum:
        - PENDING_APPROVAL
        - RECRUITING
        - READY_TO_START
        - IN_PROGRESS
        - COMPLETED
        - REJECTED
        - CANCELLED

    EnrollmentStatus:
      type: string
      enum: [APPLIED, CANCELLED]

    EnrollmentResponse:
      type: object
      required: [id, meetingId, menteeId, status, appliedAt]
      properties:
        id:
          type: integer
          format: int64
        meetingId:
          type: integer
          format: int64
        menteeId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
        appliedAt:
          type: string
          format: date-time

    ApplicantResponse:
      type: object
      required: [menteeId, appliedAt]
      properties:
        menteeId:
          type: integer
          format: int64
        nickname:
          type: string
          nullable: true
        appliedAt:
          type: string
          format: date-time

    PostCreateRequest:
      type: object
      required: [week, body]
      properties:
        week:
          type: integer
          minimum: 1
        body:
          type: string

    AttachmentResponse:
      type: object
      required: [id, postId, fileName, contentType, sizeBytes, createdAt]
      properties:
        id:
          type: integer
          format: int64
        postId:
          type: integer
          format: int64
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        uploaderId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time

    PostResponse:
      type: object
      required: [id, meetingId, authorId, week, body, attachments, createdAt]
      properties:
        id:
          type: integer
          format: int64
        meetingId:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        week:
          type: integer
        body:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    NoticeCreateRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string

    NoticeResponse:
      type: object
      required: [id, meetingId, authorId, body, createdAt]
      properties:
        id:
          type: integer
          format: int64
        meetingId:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    ErrorPayload:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: UPPER_SNAKE domain code (<DOMAIN>_<REASON>)
        message:
          type: string
          description: Human-readable Korean message
        details:
          type: object
          nullable: true
          additionalProperties: true

    SignupRequest:
      type: object
      required: [nickname, password, employeeNo, role]
      properties:
        nickname:
          type: string
        password:
          type: string
          format: password
        employeeNo:
          type: string
        role:
          type: string
          description: MENTOR or MENTEE (ADMIN is rejected)
          enum: [MENTOR, MENTEE]

    LoginRequest:
      type: object
      required: [nickname, password]
      properties:
        nickname:
          type: string
        password:
          type: string
          format: password

    SessionResponse:
      type: object
      required: [token, role]
      properties:
        token:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    UserResponse:
      type: object
      required: [id, nickname, employeeNo, role]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        employeeNo:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    ProfileResponse:
      type: object
      required: [nickname, employeeNo, tags]
      properties:
        nickname:
          type: string
        employeeNo:
          type: string
        tags:
          type: array
          items:
            type: string
        intro:
          type: string
          nullable: true

    ProfileUpdateRequest:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        intro:
          type: string
          nullable: true

    MeetingCreateRequest:
      type: object
      required: [title, weeks, capacity]
      properties:
        title:
          type: string
        topic:
          type: string
          nullable: true
        weeks:
          type: integer
        recruitStart:
          type: string
          format: date-time
          nullable: true
        recruitEnd:
          type: string
          format: date-time
          nullable: true
        capacity:
          type: integer
        format:
          type: string
          nullable: true
        initialContent:
          type: string
          nullable: true

    MeetingResponse:
      type: object
      required: [id, mentorId, title, weeks, capacity, status]
      properties:
        id:
          type: integer
          format: int64
        mentorId:
          type: integer
          format: int64
        title:
          type: string
        topic:
          type: string
          nullable: true
        weeks:
          type: integer
        recruitStart:
          type: string
          format: date-time
          nullable: true
        recruitEnd:
          type: string
          format: date-time
          nullable: true
        capacity:
          type: integer
        format:
          type: string
          nullable: true
        initialContent:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/MeetingStatus'
        rejectReason:
          type: string
          nullable: true

    MeetingSummary:
      type: object
      required: [id, title, weeks, capacity, status]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        topic:
          type: string
          nullable: true
        weeks:
          type: integer
        capacity:
          type: integer
        status:
          $ref: '#/components/schemas/MeetingStatus'

    SurveyQuestionDto:
      type: object
      required: [orderNo, text, type]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Populated on read; ignored on the upsert/write path
        orderNo:
          type: integer
        text:
          type: string
        type:
          type: string
        options:
          type: array
          items:
            type: string
        required:
          type: boolean

    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Rejection / cancellation reason (mandatory since Bolt 2)

    ConfirmRecruitmentRequest:
      type: object
      required: [proceed]
      properties:
        proceed:
          type: boolean
          description: true advances to READY_TO_START (T3); false cancels to CANCELLED (T4)
        reason:
          type: string
          nullable: true
          description: Cancellation reason, required when proceed is false

    PageMeetingSummary:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MeetingSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    SendMessageRequest:
      type: object
      required: [recipientId, body]
      properties:
        recipientId:
          type: integer
          format: int64
        body:
          type: string
          description: Message text (non-blank)

    MessageResponse:
      type: object
      required: [id, threadId, senderId, body, createdAt]
      properties:
        id:
          type: integer
          format: int64
        threadId:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        body:
          type: string
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ThreadSummaryResponse:
      type: object
      required: [threadId, partnerId, unreadCount]
      properties:
        threadId:
          type: integer
          format: int64
        partnerId:
          type: integer
          format: int64
        partnerNickname:
          type: string
          nullable: true
        lastMessageBody:
          type: string
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer

    UnreadCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64

    RecipientResponse:
      type: object
      required: [userId, nickname, role]
      properties:
        userId:
          type: integer
          format: int64
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    PageMessageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    CompletionStatus:
      type: string
      enum: [NOT_COMPLETED, COMPLETION_CANDIDATE, COMPLETED]


    CreateSessionRequest:
      type: object
      required: [week, scheduledAt]
      properties:
        week:
          type: integer
          minimum: 1
        scheduledAt:
          type: string
          format: date-time
        checkInWindowMinutes:
          type: integer
          minimum: 1
          nullable: true
          description: Check-in window length in minutes (defaults to 120 when omitted)

    UpdateSessionRequest:
      type: object
      required: [scheduledAt]
      properties:
        scheduledAt:
          type: string
          format: date-time

    MeetingSessionResponse:
      type: object
      required: [id, meetingId, week, scheduledAt, checkInWindowMinutes]
      properties:
        id:
          type: integer
          format: int64
        meetingId:
          type: integer
          format: int64
        week:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        checkInWindowMinutes:
          type: integer

    AttendanceResponse:
      type: object
      required: [sessionId, menteeId, checkedInAt]
      properties:
        sessionId:
          type: integer
          format: int64
        menteeId:
          type: integer
          format: int64
        checkedInAt:
          type: string
          format: date-time

    AttendanceSummaryResponse:
      type: object
      required: [attended, totalScheduled, rate]
      properties:
        attended:
          type: integer
        totalScheduled:
          type: integer
        rate:
          type: number
          format: double

    MenteeCompletionResponse:
      type: object
      required: [meetingId, menteeId, status, attendedCount, totalScheduled]
      properties:
        meetingId:
          type: integer
          format: int64
        menteeId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/CompletionStatus'
        attendedCount:
          type: integer
        totalScheduled:
          type: integer
        approvedAt:
          type: string
          format: date-time
          nullable: true
    SurveyAnswerRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/SurveyAnswerItem'

    SurveyAnswerItem:
      type: object
      required: [questionId]
      properties:
        questionId:
          type: integer
          format: int64
        answerText:
          type: string
          nullable: true

    SurveyAnswerResponse:
      type: object
      required: [questionId]
      properties:
        questionId:
          type: integer
          format: int64
        answerText:
          type: string
          nullable: true

    FeedbackRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    FeedbackResponse:
      type: object
      required: [id, menteeId, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        menteeId:
          type: integer
          format: int64
        content:
          type: string
        createdAt:
          type: string
          format: date-time

